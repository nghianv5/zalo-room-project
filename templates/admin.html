<!-- Bổ sung nút bấm Import Excel vào góc trên cùng -->
<div class="flex gap-2">
    <button onclick="openExcelModal()" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700 font-medium text-sm">
        📊 Import từ Excel
    </button>
    <button onclick="openModal()" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 font-medium text-sm">
        + Thêm Phòng Mới
    </button>
</div>

<!-- MODAL UPLOAD FILE EXCEL -->
<div id="excelModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-lg p-6 w-full max-w-md">
        <h2 class="text-lg font-bold mb-3 text-gray-800">📥 Nhập Danh Sách Phòng Bằng Excel</h2>
        
        <p class="text-xs text-gray-500 mb-4">
            Tải lên file <code>.xlsx</code> hoặc <code>.csv</code>. Cột bắt buộc: <strong>Địa chỉ</strong> (hoặc address). Các cột tùy chọn: Tên phòng, Tầng, Giá, WC Khép kín, Đồ đạc, Thú cưng, Ban công, Cửa sổ, Trạng thái, SĐT Chủ nhà, Media URLs.
        </p>

        <form id="excelForm" onsubmit="uploadExcel(event)">
            <div class="mb-4">
                <input type="file" id="excelFile" accept=".xlsx, .xls, .csv" required class="w-full border p-2 rounded text-sm bg-gray-50">
            </div>

            <div id="uploadStatus" class="text-xs mb-3 hidden"></div>

            <div class="flex justify-end gap-2">
                <button type="button" onclick="closeExcelModal()" class="px-4 py-2 border rounded text-sm hover:bg-gray-100">Hủy</button>
                <button type="submit" id="btnUploadSubmit" class="px-4 py-2 bg-green-600 text-white rounded text-sm font-medium hover:bg-green-700">Tải Lên & Xử Lý</button>
            </div>
        </form>
    </div>
</div>

<script>
    // --- JS XỬ LÝ UPLOAD EXCEL ---
    function openExcelModal() {
        document.getElementById("excelForm").reset();
        document.getElementById("uploadStatus").classList.add("hidden");
        document.getElementById("excelModal").classList.remove("hidden");
    }

    function closeExcelModal() {
        document.getElementById("excelModal").classList.add("hidden");
    }

    async function uploadExcel(e) {
        e.preventDefault();
        const fileInput = document.getElementById("excelFile");
        const statusDiv = document.getElementById("uploadStatus");
        const btnSubmit = document.getElementById("btnUploadSubmit");

        if (!fileInput.files[0]) return;

        const formData = new FormData();
        formData.append("file", fileInput.files[0]);

        statusDiv.className = "text-xs mb-3 text-blue-600 font-medium";
        statusDiv.innerText = "⏳ Đang tạo Vector Embedding và lưu dữ liệu...";
        statusDiv.classList.remove("hidden");
        btnSubmit.disabled = true;

        try {
            const res = await fetch("/api/rooms/upload-excel", {
                method: "POST",
                body: formData
            });

            const result = await res.json();

            if (res.ok) {
                statusDiv.className = "text-xs mb-3 text-green-600 font-bold";
                statusDiv.innerText = `✅ ${result.message}`;
                setTimeout(() => {
                    closeExcelModal();
                    loadRooms(); // Re-load danh sách phòng trên bảng
                }, 1500);
            } else {
                statusDiv.className = "text-xs mb-3 text-red-600 font-bold";
                statusDiv.innerText = `❌ Lỗi: ${result.detail || 'Không thể upload'}`;
            }
        } catch (err) {
            statusDiv.className = "text-xs mb-3 text-red-600 font-bold";
            statusDiv.innerText = `❌ Lỗi kết nối máy chủ!`;
        } finally {
            btnSubmit.disabled = false;
        }
    }
</script>
