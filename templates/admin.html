<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Quản Lý Phòng Trọ - Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-8">
    <div class="max-w-7xl mx-auto bg-white p-6 rounded-lg shadow-md">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-bold text-gray-800">📋 Quản Lý Danh Sách Phòng Trọ</h1>
            <button onclick="openModal()" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">+ Thêm Phòng Mới</button>
        </div>

        <!-- BẢNG DANH SÁCH PHÒNG -->
        <div class="overflow-x-auto">
            <table class="min-w-full border-collapse border border-gray-200">
                <thead>
                    <tr class="bg-gray-50 text-left text-xs font-semibold text-gray-600 uppercase">
                        <th class="p-3 border">Địa chỉ</th>
                        <th class="p-3 border">Tên phòng</th>
                        <th class="p-3 border">Giá</th>
                        <th class="p-3 border">Trạng thái</th>
                        <th class="p-3 border">SĐT Chủ nhà</th>
                        <th class="p-3 border">Cập nhật</th>
                        <th class="p-3 border text-center">Hành động</th>
                    </tr>
                </thead>
                <tbody id="roomTableBody" class="divide-y divide-gray-200 text-sm">
                    <!-- Dữ liệu JS sẽ nạp vào đây -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- MODAL FORM THÊM / SỬA -->
    <div id="roomModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-lg p-6 w-full max-w-lg">
            <h2 id="modalTitle" class="text-xl font-bold mb-4">Thêm Phòng Mới</h2>
            <form id="roomForm" onsubmit="saveRoom(event)">
                <input type="hidden" id="roomId">
                <div class="mb-3">
                    <label class="block text-sm font-medium">Địa chỉ (*):</label>
                    <input type="text" id="address" required class="w-full border p-2 rounded">
                </div>
                <div class="grid grid-cols-2 gap-3 mb-3">
                    <div>
                        <label class="block text-sm font-medium">Tên/Số phòng:</label>
                        <input type="text" id="room_name" class="w-full border p-2 rounded">
                    </div>
                    <div>
                        <label class="block text-sm font-medium">Giá thuê:</label>
                        <input type="text" id="price" class="w-full border p-2 rounded">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-3 mb-3">
                    <div>
                        <label class="block text-sm font-medium">Trạng thái:</label>
                        <select id="status" class="w-full border p-2 rounded">
                            <option value="TRỐNG">TRỐNG</option>
                            <option value="ĐÃ CHO THUÊ">ĐÃ CHO THUÊ</option>
                            <option value="ĐANG CÓ NGHĨA VỤ">ĐANG CÓ NGHĨA VỤ</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium">SĐT Chủ nhà:</label>
                        <input type="text" id="landlord_phone" class="w-full border p-2 rounded">
                    </div>
                </div>
                <div class="flex justify-end gap-2 mt-4">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 border rounded">Hủy</button>
                    <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded">Lưu Dữ Liệu</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const API_URL = "/api/rooms";

        // Tải danh sách phòng từ API
        async function loadRooms() {
            const res = await fetch(API_URL);
            const result = await res.json();
            const tbody = document.getElementById("roomTableBody");
            tbody.innerHTML = "";

            result.data.forEach(room => {
                tbody.innerHTML += `
                    <tr>
                        <td class="p-3 border">${room.address}</td>
                        <td class="p-3 border">${room.room_name}</td>
                        <td class="p-3 border">${room.price}</td>
                        <td class="p-3 border">
                            <span class="px-2 py-1 text-xs rounded ${room.status === 'TRỐNG' ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'}">
                                ${room.status}
                            </span>
                        </td>
                        <td class="p-3 border">${room.landlord_phone || '-'}</td>
                        <td class="p-3 border text-xs text-gray-500">${room.updated_at || '-'}</td>
                        <td class="p-3 border text-center space-x-2">
                            <button onclick='editRoom(${JSON.stringify(room)})' class="text-blue-600 hover:underline">Sửa</button>
                            <button onclick="deleteRoom('${room.id}')" class="text-red-600 hover:underline">Xóa</button>
                        </td>
                    </tr>
                `;
            });
        }

        // Lưu dữ liệu (Thêm mới hoặc Cập nhật)
        async function saveRoom(e) {
            e.preventDefault();
            const id = document.getElementById("roomId").value;
            const payload = {
                address: document.getElementById("address").value,
                room_name: document.getElementById("room_name").value,
                price: document.getElementById("price").value,
                status: document.getElementById("status").value,
                landlord_phone: document.getElementById("landlord_phone").value
            };

            const url = id ? `${API_URL}?point_id=${id}` : API_URL;
            await fetch(url, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });

            closeModal();
            loadRooms();
        }

        // Xóa phòng
        async function deleteRoom(id) {
            if (confirm("Bạn có chắc chắn muốn xóa phòng này?")) {
                await fetch(`${API_URL}/${id}`, { method: "DELETE" });
                loadRooms();
            }
        }

        function openModal() {
            document.getElementById("roomForm").reset();
            document.getElementById("roomId").value = "";
            document.getElementById("modalTitle").innerText = "Thêm Phòng Mới";
            document.getElementById("roomModal").classList.remove("hidden");
        }

        function closeModal() { document.getElementById("roomModal").classList.add("hidden"); }

        function editRoom(room) {
            document.getElementById("roomId").value = room.id;
            document.getElementById("address").value = room.address;
            document.getElementById("room_name").value = room.room_name;
            document.getElementById("price").value = room.price;
            document.getElementById("status").value = room.status;
            document.getElementById("landlord_phone").value = room.landlord_phone || "";
            document.getElementById("modalTitle").innerText = "Cập Nhật Phòng";
            document.getElementById("roomModal").classList.remove("hidden");
        }

        loadRooms();
    </script>
</body>
</html>
