<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập Khách Hàng</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">

    <div class="bg-white p-8 rounded-2xl shadow-lg w-full max-w-md">
        
        <!-- FORM 1: ĐĂNG NHẬP -->
        <div id="form-login">
            <h2 class="text-2xl font-bold text-center text-gray-800 mb-6">Đăng Nhập</h2>
            
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Số điện thoại</label>
                <input type="tel" id="login-phone" placeholder="0912345678" 
                       class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
            </div>

            <div class="mb-2">
                <label class="block text-sm font-medium text-gray-700 mb-1">Mật khẩu</label>
                <input type="password" id="login-password" placeholder="••••••••" 
                       class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
            </div>

            <div class="text-right mb-6">
                <button onclick="switchForm('forgot')" class="text-sm text-blue-600 hover:underline">Quên mật khẩu?</button>
            </div>

            <button onclick="handleLogin()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 rounded-lg transition">
                Đăng Nhập
            </button>
        </div>


        <!-- FORM 2: QUÊN MẬT KHẨU (Ẩn mặc định) -->
        <div id="form-forgot" class="hidden">
            <h2 class="text-2xl font-bold text-center text-gray-800 mb-2">Quên Mật Khẩu</h2>
            <p class="text-xs text-gray-500 text-center mb-6">Mã OTP sẽ được gửi về tài khoản Zalo của bạn</p>

            <!-- Bước 1: Nhập SĐT gửi OTP -->
            <div id="forgot-step-1">
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Số điện thoại đăng ký</label>
                    <input type="tel" id="forgot-phone" placeholder="0912345678" 
                           class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <button onclick="requestOTP()" id="btn-request-otp" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 rounded-lg transition">
                    Nhận mã OTP qua Zalo
                </button>
            </div>

            <!-- Bước 2: Nhập OTP & Mật khẩu mới -->
            <div id="forgot-step-2" class="hidden">
                <div class="mb-3">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Mã OTP (từ Zalo)</label>
                    <input type="text" id="forgot-otp" placeholder="123456" maxlength="6"
                           class="w-full px-4 py-2 border text-center font-bold tracking-widest rounded-lg focus:ring-2 focus:ring-green-500 outline-none">
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Mật khẩu mới</label>
                    <input type="password" id="forgot-new-pass" placeholder="Nhập mật khẩu mới" 
                           class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-green-500 outline-none">
                </div>
                <button onclick="handleResetPassword()" class="w-full bg-green-600 hover:bg-green-700 text-white font-semibold py-2 rounded-lg transition">
                    Đổi Mật Khẩu
                </button>
            </div>

            <div class="text-center mt-4">
                <button onclick="switchForm('login')" class="text-sm text-gray-500 hover:underline">← Quay lại Đăng nhập</button>
            </div>
        </div>

        <!-- THÔNG BÁO -->
        <div id="msg-box" class="mt-4 p-3 rounded-lg text-sm text-center hidden"></div>

    </div>

    <script>
        function showMsg(text, isError = false) {
            const box = document.getElementById('msg-box');
            box.innerText = text;
            box.className = `mt-4 p-3 rounded-lg text-sm text-center ${isError ? 'bg-red-100 text-red-700' : 'bg-green-100 text-green-700'}`;
            box.classList.remove('hidden');
        }

        function switchForm(form) {
            document.getElementById('msg-box').classList.add('hidden');
            if(form === 'forgot') {
                document.getElementById('form-login').classList.add('hidden');
                document.getElementById('form-forgot').classList.remove('hidden');
            } else {
                document.getElementById('form-forgot').classList.add('hidden');
                document.getElementById('form-login').classList.remove('hidden');
            }
        }

        // Xử lý đăng nhập
        async function handleLogin() {
            const phone = document.getElementById('login-phone').value;
            const password = document.getElementById('login-password').value;

            const res = await fetch('/api/user/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ phone, password })
            });

            const data = await res.json();
            if(res.ok) {
                showMsg("Đăng nhập thành công! Đang chuyển hướng...");
                setTimeout(() => window.location.href = "/admin", 1000);
            } else {
                showMsg(data.detail || "Đăng nhập thất bại!", true);
            }
        }

        // Yêu cầu gửi OTP qua Zalo
        async function requestOTP() {
            const phone = document.getElementById('forgot-phone').value;
            const btn = document.getElementById('btn-request-otp');
            btn.disabled = true;
            btn.innerText = "Đang gửi...";

            const res = await fetch('/api/user/request-reset-otp', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ phone })
            });

            const data = await res.json();
            btn.disabled = false;
            btn.innerText = "Nhận mã OTP qua Zalo";

            if(res.ok) {
                showMsg(data.message + (data.debug_otp ? ` (OTP Test: ${data.debug_otp})` : ""));
                document.getElementById('forgot-step-1').classList.add('hidden');
                document.getElementById('forgot-step-2').classList.remove('hidden');
            } else {
                showMsg(data.detail || "Gửi OTP thất bại!", true);
            }
        }

        // Đổi mật khẩu
        async function handleResetPassword() {
            const phone = document.getElementById('forgot-phone').value;
            const otp = document.getElementById('forgot-otp').value;
            const new_password = document.getElementById('forgot-new-pass').value;

            const res = await fetch('/api/user/reset-password', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ phone, otp, new_password })
            });

            const data = await res.json();
            if(res.ok) {
                showMsg("Đổi mật khẩu thành công!");
                setTimeout(() => location.reload(), 1500);
            } else {
                showMsg(data.detail || "Xác thực thất bại!", true);
            }
        }
    </script>
</body>
</html>
